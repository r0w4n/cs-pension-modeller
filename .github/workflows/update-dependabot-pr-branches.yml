name: Update Dependabot PR branches

on:
  push:
    branches:
      - main
  schedule:
    - cron: "43 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependabot-pr-branches
  cancel-in-progress: true

jobs:
  update-dependabot-prs:
    runs-on: ubuntu-latest
    env:
      DEPENDABOT_PAT: ${{ secrets.dependabot_pat }}

    steps:
      - name: Check automation token
        run: |
          if [ -z "$DEPENDABOT_PAT" ]; then
            echo "::error::The dependabot_pat secret is required so updated branches can trigger their pull-request checks."
            exit 1
          fi

      - name: Update open Dependabot PR branches
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.dependabot_pat }}
          script: |
            const { owner, repo } = context.repo;
            const baseBranch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "main",
            });
            const baseSha = baseBranch.data.commit.sha;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "main",
              per_page: 100,
            });

            for (const pull of pulls) {
              if (pull.user.login !== "dependabot[bot]") {
                continue;
              }

              const comparison =
                await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${pull.head.sha}...${baseSha}`,
                });

              if (comparison.data.ahead_by === 0) {
                console.log(`Dependabot PR #${pull.number} is already current.`);
                continue;
              }

              console.log(
                `Updating Dependabot PR #${pull.number}: ${pull.title}`,
              );

              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pull.number,
                  expected_head_sha: pull.head.sha,
                });
              } catch (error) {
                if (error.status === 422) {
                  core.notice(
                    `Skipped PR #${pull.number}: ${error.message}`,
                  );
                  continue;
                }

                throw error;
              }
            }
