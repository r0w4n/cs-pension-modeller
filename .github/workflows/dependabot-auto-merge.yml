name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Merge Dependabot PRs whose exact head passed CI
        id: merge
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            let candidates;

            if (context.eventName === "workflow_run") {
              const headSha = context.payload.workflow_run.head_sha;
              candidates = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: headSha,
                  per_page: 100,
                },
              );
            } else {
              candidates = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                base: "main",
                per_page: 100,
              });
            }

            const dependabotPulls = candidates.filter(
              (pull) =>
                pull.state === "open" &&
                pull.base.ref === "main" &&
                pull.user?.login === "dependabot[bot]" &&
                pull.draft === false &&
                (context.eventName !== "workflow_run" ||
                  pull.head.sha === context.payload.workflow_run.head_sha),
            );

            let mergedCount = 0;

            for (const pull of dependabotPulls) {
              if (context.eventName !== "workflow_run") {
                const runs = await github.paginate(
                  github.rest.actions.listWorkflowRuns,
                  {
                    owner,
                    repo,
                    workflow_id: "ci.yml",
                    event: "pull_request",
                    branch: pull.head.ref,
                    per_page: 100,
                  },
                );
                const testedRun = runs.find(
                  (run) => run.head_sha === pull.head.sha,
                );

                if (
                  testedRun?.status !== "completed" ||
                  testedRun.conclusion !== "success"
                ) {
                  core.notice(
                    `Skipped PR #${pull.number}: its exact head has not passed the complete CI workflow.`,
                  );
                  continue;
                }
              }

              const { data: currentPull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pull.number,
              });

              if (
                currentPull.state !== "open" ||
                currentPull.head.sha !== pull.head.sha ||
                currentPull.user?.login !== "dependabot[bot]"
              ) {
                core.notice(
                  `Skipped PR #${pull.number}: it changed after CI was checked.`,
                );
                continue;
              }

              try {
                const { data: result } = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: currentPull.number,
                  sha: currentPull.head.sha,
                  merge_method: "merge",
                  commit_title: `${currentPull.title} (#${currentPull.number})`,
                });

                if (!result.merged) {
                  core.notice(
                    `Skipped PR #${currentPull.number}: ${result.message}`,
                  );
                  continue;
                }

                mergedCount += 1;
                console.log(`Merged Dependabot PR #${currentPull.number}.`);

                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${currentPull.head.ref}`,
                  });
                } catch (error) {
                  core.notice(
                    `Merged PR #${currentPull.number}, but could not delete its branch: ${error.message}`,
                  );
                }
              } catch (error) {
                if ([405, 409, 422].includes(error.status)) {
                  core.notice(
                    `Could not merge PR #${currentPull.number}: ${error.message}`,
                  );
                  continue;
                }

                throw error;
              }
            }

            core.setOutput("merged-count", String(mergedCount));

      - name: Run CI on the updated main branch
        if: steps.merge.outputs.merged-count != '0'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "ci.yml",
              ref: "main",
            });
            console.log("Dispatched CI for the updated main branch.");
