version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
      react-runtime-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
    ignore:
      # typescript-eslint 8.x currently requires TypeScript below 6.1.
      - dependency-name: typescript
        versions:
          - ">=7.0.0 <8.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
